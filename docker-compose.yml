services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hypatia
      POSTGRES_PASSWORD: hypatia
      POSTGRES_DB: hypatia
    ports:
      - "5432:5432"
    volumes:
      - hypatia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypatia -d hypatia"]
      interval: 5s
      timeout: 3s
      retries: 8

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FIXTURE_MODE: "${FIXTURE_MODE:-true}"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_BASE_URL: ${META_BASE_URL:-https://api.meta.ai/v1}
      GLIMMER_PROVIDER: ${GLIMMER_PROVIDER:-stub}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      DATABASE_URL: postgresql://hypatia:hypatia@db:5432/hypatia
    command:
      [
        "sh",
        "-c",
        "python -m hypatia.db migrate && exec uvicorn hypatia.app:app --host 0.0.0.0 --port 8000",
      ]
    volumes:
      - ./data:/app/data
      - ./services/api/hypatia:/app/hypatia
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/api/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    environment:
      API_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  hypatia_pg:
